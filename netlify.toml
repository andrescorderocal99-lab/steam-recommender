[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Catálogo: siempre revalidar (los precios cambian a diario) y CORS abierto para que la
# futura app Capacitor (origen capacitor://localhost) pueda descargarlo.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Access-Control-Allow-Origin = "*"

# JS/CSS con hash en el nombre: caché permanente.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
