name: Descubrir juegos nuevos (semanal)

on:
  schedule:
    - cron: "0 4 * * 0" # domingos a las 04:00 UTC
  workflow_dispatch:
    inputs:
      pages:
        description: "Páginas de CheapShark a recorrer (60 deals/página, ~6 s por juego nuevo)"
        required: false
        default: "5"
        type: string

permissions:
  contents: write

# Comparte grupo con update-prices para que nunca escriban games.db a la vez.
concurrency:
  group: catalog-data
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      # El pipeline guarda cada juego en SQLite según lo procesa: si se corta por
      # tiempo, los pasos siguientes suben lo ya descargado y la próxima ejecución retoma.
      - name: Descubrir juegos nuevos
        working-directory: scraper
        timeout-minutes: 150
        run: python run.py --pages ${{ inputs.pages || 5 }}

      - name: Consolidar base SQLite
        if: ${{ !cancelled() }}
        run: python -c "import sqlite3; c = sqlite3.connect('data/games.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"

      - name: Commit y push si hay cambios
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.db frontend/public/data/
          if git diff --cached --quiet; then
            echo "No hay juegos nuevos."
            exit 0
          fi
          git commit -m "chore: discover new Steam games"
          git push
