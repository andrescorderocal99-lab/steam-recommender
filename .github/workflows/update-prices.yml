name: Actualizar precios (diario)

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC = 07:00 (invierno) / 08:00 (verano) en España
  workflow_dispatch:

permissions:
  contents: write

# Comparte grupo con discover-games para que nunca escriban games.db a la vez.
concurrency:
  group: catalog-data
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Refrescar precios
        working-directory: scraper
        timeout-minutes: 20
        run: python run.py --update-prices

      # Si el proceso muere a medias, vuelca el WAL de SQLite dentro de games.db
      # (los ficheros -wal/-shm no se versionan).
      - name: Consolidar base SQLite
        if: ${{ !cancelled() }}
        run: python -c "import sqlite3; c = sqlite3.connect('data/games.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"

      - name: Commit y push si hay cambios
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/games.db frontend/public/data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios."
            exit 0
          fi
          git commit -m "chore: update Steam prices"
          git push
